services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gpcfc
      POSTGRES_USER: gpcfc
      POSTGRES_PASSWORD: gpcfc_dev_only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpcfc -d gpcfc"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: dev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-admin-only
    volumes: ["./infrastructure/keycloak:/opt/keycloak/data/import:ro"]
    ports: ["127.0.0.1:8080:8080"]
  s3mock:
    image: adobe/s3mock:5.1.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: gp-cfc-dev
    ports: ["127.0.0.1:9090:9090"]
volumes:
  pgdata:
  redisdata:
