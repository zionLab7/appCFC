name: checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gpcfc_test
          POSTGRES_USER: gpcfc
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gpcfc -d gpcfc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://gpcfc:test-only@localhost:5432/gpcfc_test
      GP_CFC_TEST_DATABASE_URL: postgres://gpcfc:test-only@localhost:5432/gpcfc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/migrate.mjs
      - run: npm run test:integration
